name: ScreamSeq macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      qualification:
        description: 'Full app, standalone native interface, or pinned stock PCM qualification'
        type: choice
        options: [full, interface, stock]
        default: full
      build_runner:
        description: 'Architecture for a manually requested full build; pushes and PRs build both'
        type: choice
        options: [both, macos-15, macos-15-intel]
        default: both
      retained_app_run:
        description: 'Existing Mac build run ID; blank performs a normal build'
        type: string
        default: ''
      retained_runner:
        description: 'Architecture for retained-app or interface-only qualification'
        type: choice
        options: [both, macos-15, macos-15-intel]
        default: both
      retained_artifact_kind:
        description: 'Final logs artifact, or early app archive if qualification timed out'
        type: choice
        options: [logs, app]
        default: logs
      fixture_run:
        description: 'Preceding fixture run ID; blank rechecks the original corpus/API/codec baseline'
        type: string
        default: ''
      fixture_artifact:
        description: 'Exact preceding artifact name (normally screamseq-windows-logs)'
        type: string
        default: ''
      fixture_layout:
        description: 'Initial Windows outputs or a retained exchange result'
        type: choice
        options: [windows, exchange]
        default: windows
      extended_exchange:
        description: 'Also require edited opaque metadata, composing history and envelope-bank saved outputs'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: screamseq-macos-${{ github.workflow }}-${{ github.ref }}-${{ inputs.qualification || 'full' }}-${{ inputs.build_runner || 'both' }}-${{ inputs.retained_app_run || 'build' }}-${{ inputs.retained_runner || 'both' }}-${{ inputs.fixture_run || 'baseline' }}-${{ inputs.fixture_artifact }}-${{ inputs.extended_exchange || false }}
  cancel-in-progress: true

jobs:
  native-app:
    if: github.event_name != 'workflow_dispatch' || (inputs.retained_app_run == '' && inputs.qualification == 'full')
    name: Native app (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.build_runner == 'macos-15' && '["macos-15"]' || inputs.build_runner == 'macos-15-intel' && '["macos-15-intel"]' || '["macos-15","macos-15-intel"]') }}
    runs-on: ${{ matrix.runner }}
    # Intel's clean build plus unchanged acceptance suites can exceed an hour.
    # Keep individual test deadlines; allow the job to finish without rebuilding.
    timeout-minutes: ${{ matrix.runner == 'macos-15-intel' && 90 || 60 }}
    env:
      SCREAMSEQ_BUILD_DIR: bin/mac-ci
      SCREAMSEQ_BUILD_JOBS: "2"
      RESONANCE_DEVELOPMENT_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check reviewed API inventory before compilation
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s editor/Tests/Conformance -p test_api_vectors.py -v 2>&1 | tee screamseq-macos-api-preflight.log
      - name: Build C++ targets and Swift application from a clean tree
        id: build
        shell: bash
        run: |
          set -o pipefail
          bash mac/build.sh 2>&1 | tee screamseq-macos-build.log
      - name: Retain the built app for reciprocal checks without rebuilding
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          tar -czf "$SCREAMSEQ_BUILD_DIR/native-app.tar.gz" -C "$SCREAMSEQ_BUILD_DIR" ScreamSeq.app
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          build = pathlib.Path(os.environ['SCREAMSEQ_BUILD_DIR'])
          def digest(path):
              return hashlib.sha256((build / path).read_bytes()).hexdigest()
          identity = dict(sourceCommit=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              executableSHA256=digest('ScreamSeq.app/Contents/MacOS/ScreamSeq'),
              archiveSHA256=digest('native-app.tar.gz'),
              buildReceiptSHA256=digest('ScreamSeq.app/Contents/Resources/BuildInfo.json'),
              qualification='Built candidate; test results are separate and may fail.')
          (build / 'native-app-identity.json').write_text(json.dumps(identity, indent=2) + '\n')
          PY
      - name: Preserve the completed app before qualification
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: screamseq-macos-${{ matrix.runner }}-app
          path: |
            screamseq-macos-build.log
            bin/mac-ci/native-app.tar.gz
            bin/mac-ci/native-app-identity.json
            bin/mac-ci/ScreamSeq.app/Contents/Resources/BuildInfo.json
          if-no-files-found: error
          retention-days: 14
      - name: Native model and host tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir "$SCREAMSEQ_BUILD_DIR" --output-on-failure --timeout 120 -j 2 2>&1 | tee screamseq-macos-tests.log
      - name: Swift recovery and picker tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          "$SCREAMSEQ_BUILD_DIR/recovery-tests"
          "$SCREAMSEQ_BUILD_DIR/plugin-picker-tests"
      - name: Private socket admission and busy replay
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          RESONANCE_BUILD_DIR="$SCREAMSEQ_BUILD_DIR" python -B mac/Tests/test_automation.py --busy-receipts-only 2>&1 | tee screamseq-macos-busy-replay.log
      # Live device recording is temporarily excluded from hosted CI. The
      # --ui checks exercise plugin editors and offline callbacks without a device.
      - name: Owned AU and VST3 editor notification lifecycle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee screamseq-macos-plugin-editors.log
          import os, pathlib, subprocess
          build = pathlib.Path(os.environ['SCREAMSEQ_BUILD_DIR']).resolve(strict=True)
          subprocess.run([str(build / 'native-plugin-tests'),
              str(build / 'test-plugins/ResonanceFixture.vst3'), '--ui'],
              check=True, timeout=120)
          PY
      - name: Sample library tests from the existing build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          "$SCREAMSEQ_BUILD_DIR/sample-library-tests" 2>&1 | tee screamseq-macos-sample-library.log
      - name: Full native interface harness
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          bash mac/test-interface.sh 2>&1 | tee screamseq-macos-interface.log
      - name: Typed fixtures and actual socket conformance baseline
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s editor/Tests/Conformance -p 'test_*.py' -v 2>&1 | tee screamseq-macos-conformance-tools.log
          python -B -m unittest discover -s windows/Tests/Project -p 'test_*.py' -v 2>&1 | tee screamseq-macos-conformance-project-helper.log
          executable="$SCREAMSEQ_BUILD_DIR/ScreamSeq.app/Contents/MacOS/ScreamSeq"
          binary_hash="$(shasum -a 256 "$executable" | cut -d ' ' -f 1)"
          python -B editor/Tests/Conformance/native_roundtrip.py \
            --executable "$executable" --binary-sha256 "$binary_hash" \
            --binary-source-commit "$(git rev-parse HEAD)" \
            --build-receipt "$SCREAMSEQ_BUILD_DIR/ScreamSeq.app/Contents/Resources/BuildInfo.json" \
            --output "$SCREAMSEQ_BUILD_DIR/parity-conformance" --editing-contracts --api-vectors --codec-vectors --duration-defaults --edited-metadata --composing-history --envelope-bank \
            2>&1 | tee screamseq-macos-conformance-native.log
      - name: Configured test scheduling inventory
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          ctest --test-dir "$SCREAMSEQ_BUILD_DIR" --show-only=json-v1 > "$SCREAMSEQ_BUILD_DIR/test-registration.json"
          python -B editor/Tests/Conformance/schedule_inventory.py \
            --ctest-json "$SCREAMSEQ_BUILD_DIR/test-registration.json" --platform macos \
            --output "$SCREAMSEQ_BUILD_DIR/test-schedule.json"
      - name: Preserve qualification logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: screamseq-macos-${{ matrix.runner }}-logs
          path: |
            screamseq-macos-*.log
            bin/mac-ci/Testing/Temporary/*.log
            bin/mac-ci/CMakeFiles/CMakeConfigureLog.yaml
            bin/mac-ci/CMakeCache.txt
            bin/mac-ci/native-app.tar.gz
            bin/mac-ci/native-app-identity.json
            bin/mac-ci/test-registration.json
            bin/mac-ci/test-schedule.json
            bin/mac-ci/parity-conformance/**
            bin/mac-ci/ScreamSeq.app/Contents/Resources/BuildInfo.json
          if-no-files-found: warn
          retention-days: 14
  retained-app:
    if: github.event_name == 'workflow_dispatch' && inputs.retained_app_run != '' && inputs.qualification == 'full'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.retained_runner == 'macos-15' && '["macos-15"]' || inputs.retained_runner == 'macos-15-intel' && '["macos-15-intel"]' || '["macos-15","macos-15-intel"]') }}
    uses: ./.github/workflows/ScreamSeq-Retained.yml
    with:
      runner: ${{ matrix.runner }}
      app-run: ${{ inputs.retained_app_run }}
      app-artifact: screamseq-macos-${{ matrix.runner }}-${{ inputs.retained_artifact_kind || 'logs' }}
      input-run: ${{ inputs.fixture_run }}
      input-artifact: ${{ inputs.fixture_artifact }}
      input-layout: ${{ inputs.fixture_layout }}
      extended-exchange: ${{ inputs.extended_exchange || false }}
  interface-only:
    if: github.event_name == 'workflow_dispatch' && inputs.qualification == 'interface' && inputs.retained_app_run == ''
    name: Native interface only (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.retained_runner == 'macos-15' && '["macos-15"]' || inputs.retained_runner == 'macos-15-intel' && '["macos-15-intel"]' || '["macos-15","macos-15-intel"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      SCREAMSEQ_BUILD_DIR: bin/mac-interface
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compile and run the standalone interface harness once
        shell: bash
        run: |
          set -o pipefail
          bash mac/test-interface.sh 2>&1 | tee screamseq-macos-interface.log
      - name: Identify the compiled harness even when an assertion failed
        if: always()
        shell: bash
        run: |
          if [[ -f "$SCREAMSEQ_BUILD_DIR/interface-tests" ]]; then
            python3 mac/Tools/build_manifest.py "$SCREAMSEQ_BUILD_DIR/InterfaceSource.json"
            shasum -a 256 "$SCREAMSEQ_BUILD_DIR/interface-tests" > "$SCREAMSEQ_BUILD_DIR/interface-tests.sha256"
          fi
      - name: Preserve interface evidence without claiming an app build
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: screamseq-interface-${{ matrix.runner }}
          path: |
            screamseq-macos-interface.log
            bin/mac-interface/interface-tests
            bin/mac-interface/interface-tests.sha256
            bin/mac-interface/InterfaceSource.json
          if-no-files-found: warn
          retention-days: 14
  stock-pcm:
    if: github.event_name == 'workflow_dispatch' && inputs.qualification == 'stock'
    name: Pinned stock PCM (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SCREAMSEQ_BUILD_DIR: bin/mac-stock-pcm
      SCREAMSEQ_BUILD_JOBS: "2"
      SCREAMSEQ_AUDIO_BLOCKS: "512,17,4096"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fetch the exact retained upstream oracle commit
        shell: bash
        run: git fetch --no-tags --depth=1 origin f83cedb0cd5446e4dfaa83ac97e3087107e26767
      - name: Build only core fixture and callback audit targets
        shell: bash
        run: |
          set -o pipefail
          cmake -S mac -B "$SCREAMSEQ_BUILD_DIR" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 2>&1 | tee screamseq-stock-configure.log
          cmake --build "$SCREAMSEQ_BUILD_DIR" --parallel "$SCREAMSEQ_BUILD_JOBS" --target tracker-core-tests render-audit 2>&1 | tee screamseq-stock-core-build.log
      - name: Build and test the isolated pinned upstream library
        shell: bash
        run: |
          set -o pipefail
          bash mac/build-reference.sh 2>&1 | tee screamseq-stock-reference.log
      - name: Generate fixtures and compare exact PCM at three block sizes
        shell: bash
        run: |
          set -o pipefail
          "$SCREAMSEQ_BUILD_DIR/tracker-core-tests" "$GITHUB_WORKSPACE" 2>&1 | tee screamseq-stock-fixtures.log
          python3 -B mac/test_audio.py 2>&1 | tee screamseq-stock-comparisons.log
      - name: Record harness and source identities even on failed assertions
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          build = pathlib.Path(os.environ['SCREAMSEQ_BUILD_DIR'])
          build.mkdir(parents=True, exist_ok=True)
          files = ['render-audit', 'tracker-core-tests', 'reference-renderer', 'reference-source.json', 'audio-test-results.json']
          receipt = dict(sourceCommit=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              blockFrames=[512,17,4096], hashes={name: hashlib.sha256((build/name).read_bytes()).hexdigest()
              for name in files if (build/name).is_file()},
              qualification='Identity only; exact comparisons and upstream tests must pass separately.')
          (build/'harness-identity.json').write_text(json.dumps(receipt, indent=2)+'\n')
          PY
      - name: Retain stock PCM evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: screamseq-stock-pcm-macos-15
          path: |
            screamseq-stock-*.log
            bin/mac-stock-pcm/reference-build.log
            bin/mac-stock-pcm/stock-test-results.log
            bin/mac-stock-pcm/reference-source.json
            bin/mac-stock-pcm/audio-test-results.json
            bin/mac-stock-pcm/harness-identity.json
            bin/mac-stock-pcm/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 14
