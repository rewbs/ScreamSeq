name: ScreamSeq Windows

on:
  push:
    branches: [main, codex/windows-native]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screamseq-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-app:
    name: Native app (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build native application and all test targets once
        id: build
        shell: pwsh
        run: |
          ./windows/build.ps1 -Architecture x64 -BuildDirectory bin/windows-ci -Jobs 2 *>&1 | Tee-Object screamseq-windows.log
      - name: Portable and worker tests from the grouped build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          ctest --test-dir bin/windows-ci -C Release --output-on-failure --no-tests=error -L '^(portable|worker)$' *>&1 | Tee-Object screamseq-windows-model.log
          if ($LASTEXITCODE -ne 0) { throw 'Portable or worker checks failed.' }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          python-version: '3.12'
      - name: Scratch editor on an owned private desktop
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:SCREAMSEQ_TEST_EXE = (Resolve-Path bin/windows-ci/Release/ScreamSeq.exe).Path
          $env:TMPDIR = Join-Path $env:RUNNER_TEMP 'screamseq-scratch-ui'
          New-Item -ItemType Directory -Force $env:TMPDIR | Out-Null
          python -m unittest discover -s windows/Tests -p test_scratch_editor.py -v *>&1 | Tee-Object screamseq-scratch-ui.log
          if ($LASTEXITCODE -ne 0) { throw 'Scratch private-desktop checks failed.' }
      - name: Native editor, preference and recovery tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          ctest --test-dir bin/windows-ci -C Release --output-on-failure --no-tests=error -L '^(native-ui|preferences|recovery)$' *>&1 | Tee-Object screamseq-retained-editors.log
          if ($LASTEXITCODE -ne 0) { throw 'Retained native editor checks failed.' }
      - name: Merged commands and closure paths on private desktops
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:SCREAMSEQ_TEST_EXE = (Resolve-Path bin/windows-ci/Release/ScreamSeq.exe).Path
          $env:SCREAMSEQ_TEST_LIVE_AUDIO = '1'
          $env:TMPDIR = Join-Path $env:RUNNER_TEMP 'screamseq-integration-ui'
          New-Item -ItemType Directory -Force $env:TMPDIR | Out-Null
          $integrationLog = Join-Path $env:GITHUB_WORKSPACE 'screamseq-integration-ui.log'
          Push-Location windows/Tests
          try {
            python -m unittest -v `
              test_workspace_shortcuts.WorkspaceShortcutTests `
              test_recording.RecordingTests `
              test_midi_recording_ui.MidiRecordingUITests `
              test_sample_capture_ui.SampleCaptureUiTests `
              test_recovery.RecoveryTests.test_native_browser_save_reload_restore_and_file_save_cleanup `
              test_recovery.RecoveryTests.test_close_drains_pending_native_recovery_write `
              test_recovery.RecoveryTests.test_pending_write_allows_edits_and_save_cleanup_cannot_resurrect_old_copies `
              test_audition.AuditionTests.test_pattern_typing_selected_sound_repeat_limits_history_and_reopen `
              test_audition.AuditionTests.test_typing_routes_precise_rows_to_the_captured_editor `
              test_audition.AuditionTests.test_sample_dock_typing_live_mode_and_text_focus `
              test_audition.AuditionTests.test_native_sample_and_instrument_typing_capture_text_and_close `
              test_audition.AuditionTests.test_keyup_during_document_wait_never_starts_a_late_voice `
              test_pattern_performance.PatternPerformanceTests.test_typed_native_inline_slots_and_musical_unit_draft `
              test_pattern_performance.PatternPerformanceTests.test_inline_nudge_decimal_fields_commit_once_history_and_persistence `
              test_precise_note_host.PreciseNoteHostTests.test_simultaneous_hosts_compact_focus_and_saved_layout_retain_native_drafts `
              test_graph_curve_host.GraphCurveHostTests.test_routing_and_curve_keep_independent_raw_drafts_and_targets *>&1 | Tee-Object $integrationLog
            if ($LASTEXITCODE -ne 0) { throw 'Merged command and editor paths failed.' }
          } finally { Pop-Location }
      - name: Typed fixtures and actual pipe conformance baseline
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          python -B -m unittest discover -s editor/Tests/Conformance -p 'test_*.py' -v *>&1 | Tee-Object screamseq-conformance-tools.log
          if ($LASTEXITCODE -ne 0) { throw 'Conformance tool checks failed.' }
          python mac/Tools/build_manifest.py bin/windows-ci/BuildInfo.json
          if ($LASTEXITCODE -ne 0) { throw 'Build receipt capture failed.' }
          $executable = (Resolve-Path bin/windows-ci/Release/ScreamSeq.exe).Path
          $binaryHash = (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant()
          $builtCommit = (git rev-parse HEAD).Trim()
          python -B editor/Tests/Conformance/native_roundtrip.py --executable $executable --binary-sha256 $binaryHash --binary-source-commit $builtCommit --build-receipt bin/windows-ci/BuildInfo.json --output bin/windows-ci/parity-conformance --api-vectors *>&1 | Tee-Object screamseq-conformance-native.log
          if ($LASTEXITCODE -ne 0) { throw 'Native conformance baseline did not match; inspect retained reports.' }
      - name: Preserve qualification logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: screamseq-windows-logs
          path: |
            screamseq-windows.log
            screamseq-windows-model.log
            screamseq-scratch-ui.log
            screamseq-retained-editors.log
            screamseq-integration-ui.log
            screamseq-conformance-*.log
            bin/windows-ci/parity-conformance/**
            bin/windows-ci/BuildInfo.json
            bin/windows-ci/CMakeCache.txt
            bin/windows-ci/Testing/Temporary/*.log
            bin/windows-ci/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14
